# CI do Estudae: roda em todo PR, em push na main e manualmente (aba Actions).
# Tres jobs em paralelo:
#   backend  -> build, testes (unidade + integracao com Postgres) e validacao dos JSONs de conteudo
#   frontend -> npm ci, lint, testes (Vitest) e build do Vite
#   compose  -> sobe o docker compose de verdade num banco vazio e faz um smoke test
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Um push novo no mesmo PR/branch cancela a execucao anterior, que ficou obsoleta.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# O workflow so le o repositorio; nada de escrever com o token.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # Postgres descartavel ao lado do job. O job so comeca depois do healthcheck.
    # Senha so de CI: o banco morre junto com o job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: estudae
          POSTGRES_PASSWORD: estudae_ci
          POSTGRES_DB: estudae
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U estudae -d estudae"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Os testes de integracao leem esta variavel e criam um banco proprio nela.
      ConnectionStrings__Estudae: Host=localhost;Port=5432;Database=estudae;Username=estudae;Password=estudae_ci
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # Instala o SDK que o global.json pede (o mesmo da maquina de dev).
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Testes
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

      # O conteudo real mora no banco, nao no repo. Aqui so confere que o
      # subcomando "importar" da linha de comando aceita o exemplo da documentacao.
      - name: Validar exemplo de conteudo
        run: dotnet run --no-build -c Release --project src/Estudae.Api -- importar "$GITHUB_WORKSPACE/docs/conteudo/exemplos/exemplo-valido.json" --validar

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Node 22: a mesma major do estagio do front no backend/Dockerfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # O compose exige POSTGRES_PASSWORD no .env. Senha so de CI.
      - name: Criar .env
        run: |
          printf 'POSTGRES_PASSWORD=estudae_ci\nDB_PORT=5432\nAPI_PORT=8080\n' > .env

      # db (healthy) -> migrate (num banco VAZIO, entao aplica todas as migrations) -> api
      - name: Subir o compose
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Smoke test
        run: |
          # O --wait so espera a api ficar "running" (ela nao tem healthcheck), mas
          # o Kestrel so abre a porta depois de carregar as chaves de Data Protection
          # do banco (~5 s num banco vazio). Ate la a conexao e resetada (curl 56),
          # entao o /health insiste ate responder; ele e o portao do resto do teste.
          # --retry-all-errors: sem ele o curl nao repete o erro 56 nem o 503.
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 2 --retry-max-time 90 --retry-all-errors \
            http://localhost:8080/health | grep -x Healthy
          # O shell do app React sobe na raiz e em qualquer URL limpa (fallback de SPA).
          curl --fail --silent --show-error http://localhost:8080/ | grep -q 'id="app"'
          curl --fail --silent --show-error http://localhost:8080/home | grep -q 'id="app"'
          # Mas /api desconhecida e 404 de verdade, nao o index.html.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/api/rota-que-nao-existe)" = "404"
          curl --fail --silent --show-error http://localhost:8080/api/disciplinas | grep -x '\[\]'
          docker compose logs migrate | grep -q "Migrations aplicadas"

      - name: Logs (se falhar)
        if: failure()
        run: docker compose logs

      - name: Derrubar
        if: always()
        run: docker compose down -v
