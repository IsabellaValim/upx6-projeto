# Estudae: banco + migrations + API (que tambem serve o front).
#
# Antes da primeira vez:  cp .env.example .env   (e defina POSTGRES_PASSWORD)
#
# Tudo:          docker compose up -d --build --wait   -> http://localhost:8080
# So o banco:    docker compose up -d --wait db        (para rodar a API com dotnet run)
# Status:        docker compose ps
# Logs:          docker compose logs -f api
# Importar:      docker compose run --rm api importar conteudo/matematica.json --publicar
# Parar:         docker compose down        (mantem os dados)
#                docker compose down -v     (APAGA os dados)
#
# Ordem de subida (depends_on):  db (healthy) -> migrate (terminou ok) -> api

# Mesma imagem para "migrate" e "api": o build e um so (o segundo vem do cache).
x-imagem-api: &imagem-api
  build:
    context: .                 # raiz do repo: o Dockerfile copia backend/, src/ e conteudo/
    dockerfile: backend/Dockerfile
  image: estudae-api

# Connection string montada aqui, a partir do .env. Dentro da rede do Compose
# o banco e "db" na porta 5432 (nome do servico e porta interna), nao localhost.
x-conexao: &conexao
  ConnectionStrings__Estudae: "Host=db;Port=5432;Database=estudae;Username=estudae;Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja .env.example)}"

services:
  db:
    # Major fixado de proposito: trocar de major torna o diretorio de dados
    # incompativel e exige pg_upgrade. Minor (16.15 -> 16.16) e seguro.
    image: postgres:16
    container_name: estudae-db

    environment:
      # Lidas pelo entrypoint da imagem APENAS na primeira inicializacao, ou seja,
      # quando o volume ainda nao tem $PGDATA/PG_VERSION. Se o banco ja existe,
      # mudar qualquer uma destas variaveis nao tem efeito nenhum.
      POSTGRES_USER: estudae
      POSTGRES_DB: estudae
      # Segredo: vem do .env (nao comitado). Sem ele o Compose se recusa a subir.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja .env.example)}

    ports:
      # Formato host:container. So para desenvolvimento (dotnet run e psql no
      # host); a API do Compose fala com o banco pela rede interna, sem porta.
      # DB_PORT vem do .env e cai para 5432 se nao estiver definida.
      #
      # Preso em 127.0.0.1 de proposito: em WSL2 com mirrored networking, publicar
      # em 0.0.0.0 deixaria o banco exposto na rede local.
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    volumes:
      # Volume gerenciado pelo Docker. E o que faz os dados sobreviverem a
      # destruicao do container (e ao docker compose down).
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      # -h 127.0.0.1 forca TCP de proposito: pelo socket unix o pg_isready pode
      # responder "pronto" durante a inicializacao, enquanto o servidor temporario
      # do initdb ainda esta no ar. O cliente real usa TCP, entao testamos TCP.
      # -U/-d nao mudam o veredito (pg_isready nao autentica), mas evitam
      # FATAL: role "root" does not exist no log.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U estudae -d estudae"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Falhas dentro do start_period nao contam para o retries.
      start_period: 30s

    restart: unless-stopped

  # Roda uma vez e termina: aplica as migrations pendentes. Se falhar, a API nao
  # sobe (melhor do que subir com o banco pela metade).
  migrate:
    <<: *imagem-api
    container_name: estudae-migrate
    command: ["migrar"]
    environment:
      <<: *conexao
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *imagem-api
    container_name: estudae-api
    environment:
      <<: *conexao
    ports:
      # So em 127.0.0.1: em producao quem fica na frente e o proxy (Caddy).
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
